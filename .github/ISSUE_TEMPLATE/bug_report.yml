name: Installation or setup problem
description: Report a problem with the installer, checker, or instructions.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Please include only sanitized output. Do not paste tokens, passwords, AWS keys, account IDs, private configuration, or personal chat logs.
        For vulnerabilities, use the private Security reporting link instead.
  - type: dropdown
    id: operating_system
    attributes:
      label: Operating system
      options:
        - macOS on Apple silicon
        - macOS on Intel
        - Windows 11
        - Windows 10
        - Windows Server
        - Linux or WSL
        - Another environment
    validations:
      required: true
  - type: input
    id: os_and_terminal
    attributes:
      label: OS version and terminal
      description: For example, macOS 27.2 with Terminal or Windows 11 with Git Bash.
    validations:
      required: true
  - type: dropdown
    id: profile
    attributes:
      label: Installation profile
      options:
        - Full (default)
        - AWS
        - Collaboration
        - Not sure
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: Launchpad and tool versions
      description: Include your Launchpad release and the output of claude --version, node --version, and git --version. If a command is missing, say so.
      render: text
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: What steps led to the problem?
      description: Include the exact command you ran and whether this was a fresh installation or a repeat.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Error and checker output
      description: Paste the relevant error and output from bash doctor.sh with your chosen --profile, if available. Remove private details first.
      render: text
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I removed credentials, private configuration, and personal information from this report.
          required: true
