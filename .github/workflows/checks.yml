name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Repository checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out this revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: "false"
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          package-manager-cache: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Check repository files and local documentation links
        run: python scripts/check_repository.py
      - name: Test installer and doctor success and failure paths without installing tools
        run: python tests/test_setup.py
      - name: Test release evidence, archive contents, and asset verification without publishing
        run: python tests/test_release.py
      - name: Test protocol negotiation without network access
        run: python tests/test_protocol.py
      - name: Check whitespace
        run: git diff --check

  lint:
    name: ShellCheck and Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install pinned linters
        run: python -m pip install ruff==0.17.3 shellcheck-py==0.11.0.1
      - name: Check Bash scripts
        run: shellcheck --shell=bash install.sh doctor.sh scripts/setup-common.sh
      - name: Check Python scripts and tests
        run: ruff check --select E9,F scripts/ tests/
