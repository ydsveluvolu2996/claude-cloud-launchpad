name: Installation smoke test

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 6 * * 1'

permissions:
  contents: read

concurrency:
  group: installation-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    name: Native installation (${{ matrix.os }}, ${{ matrix.profile }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        profile: [aws, collaboration, full]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
        working-directory: Launchpad source
    env:
      DISABLE_AUTOUPDATER: "1"
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
      LAUNCHPAD_PROFILE: ${{ matrix.profile }}

    steps:
      - name: Check out this revision into a path with spaces
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: "false"
        with:
          persist-credentials: false
          path: Launchpad source

      - name: Install current Node.js LTS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          package-manager-cache: false

      - name: Install Python for verification
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Create an isolated Claude profile and npm cache
        env:
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/Launchpad test profile
          npm_config_cache: ${{ runner.temp }}/Launchpad npm cache
        run: |
          mkdir -p "$CLAUDE_CONFIG_DIR" "$npm_config_cache"
          printf 'CLAUDE_CONFIG_DIR=%s\n' "$CLAUDE_CONFIG_DIR" >> "$GITHUB_ENV"
          printf 'npm_config_cache=%s\n' "$npm_config_cache" >> "$GITHUB_ENV"

      - name: Install native Claude Code on macOS
        if: runner.os == 'macOS'
        run: |
          installed=false
          for attempt in 1 2 3; do
            if curl -fsSL --retry 3 https://claude.ai/install.sh | bash && "$HOME/.local/bin/claude" --version; then
              installed=true
              break
            fi
            echo "Claude Code download did not finish (attempt $attempt of 3)."
            if [ "$attempt" -lt 3 ]; then sleep 10; fi
          done
          "$installed"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install native Claude Code on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $claudeBin = Join-Path $env:USERPROFILE '.local\bin'
          $claudeExe = Join-Path $claudeBin 'claude.exe'
          $installed = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            & pwsh -NoProfile -Command 'irm https://claude.ai/install.ps1 | iex'
            if ($LASTEXITCODE -eq 0 -and (Test-Path $claudeExe)) {
              & $claudeExe --version
              if ($LASTEXITCODE -eq 0) {
                $installed = $true
                break
              }
            }
            Write-Host "Claude Code download did not finish (attempt $attempt of 3)."
            if ($attempt -lt 3) { Start-Sleep -Seconds 10 }
          }
          if (-not $installed) { throw 'Native Claude Code installation failed after 3 attempts.' }
          Add-Content -Path $env:GITHUB_PATH -Value $claudeBin
          $gitBash = Join-Path $env:ProgramFiles 'Git\bin\bash.exe'
          if (-not (Test-Path $gitBash)) { throw 'Git for Windows Bash is missing from this runner.' }
          Add-Content -Path $env:GITHUB_ENV -Value "CLAUDE_CODE_GIT_BASH_PATH=$gitBash"

      - name: Record tool versions
        run: |
          git --version
          bash --version
          node --version
          npx --version
          python --version
          claude --version

      - name: Install the selected real plugins and MCP configuration
        run: bash install.sh --profile "$LAUNCHPAD_PROFILE"

      - name: Run the beginner setup check
        run: bash doctor.sh --profile "$LAUNCHPAD_PROFILE" 2>&1 | tee "$RUNNER_TEMP/launchpad-doctor.log"

      - name: Verify the fresh installation
        run: python scripts/verify_installation.py --profile "$LAUNCHPAD_PROFILE" --report "$RUNNER_TEMP/launchpad-versions-fresh.json" 2>&1 | tee "$RUNNER_TEMP/launchpad-verification-fresh.log"

      - name: Run the installer again
        run: bash install.sh --profile "$LAUNCHPAD_PROFILE"

      - name: Verify the repeated installation
        run: python scripts/verify_installation.py --profile "$LAUNCHPAD_PROFILE" --report "$RUNNER_TEMP/launchpad-versions-repeat.json" 2>&1 | tee "$RUNNER_TEMP/launchpad-verification-repeat.log"

      - name: Upload sanitized verification results and tested versions
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installation-verification-${{ matrix.os }}-${{ matrix.profile }}
          path: |
            ${{ runner.temp }}/launchpad-doctor.log
            ${{ runner.temp }}/launchpad-verification-fresh.log
            ${{ runner.temp }}/launchpad-verification-repeat.log
            ${{ runner.temp }}/launchpad-versions-fresh.json
            ${{ runner.temp }}/launchpad-versions-repeat.json
          if-no-files-found: warn
          retention-days: 30
          # Keep one current artifact per profile when a failed job is rerun.
          overwrite: true
